telegram:
  # Your Telegram user ID (get it from @userinfobot). Empty list = allow all (dev only).
  allowed_user_ids: [123456789]

hledger:
  journal_path: ~/finance/journal.hledger
  git_branch: main

# Optional: canonical card names. The AI-detected card name is fuzzy-matched
# against these, so each card is tracked under one stable name/account.
# Used by the AI parser (offset_account) and to stabilise the "last processed"
# state key.
cards:
  - name: DBS Altitude
    liability_account: liabilities:creditcard:dbs
    parser: dbs
  - name: OCBC 90N
    liability_account: liabilities:creditcard:ocbc
    parser: ocbc
  - name: UOB One
    offset_account: assets:bank:uob

# Statements are always from the current year, but the vision model often
# misreads the year. When true, every parsed transaction's year is forced to
# the current year after parsing.
force_current_year: true

currency: SGD

ai:
  # Options: gemini (free, needs GOOGLE_API_KEY), groq (free, needs GROQ_API_KEY), none
  provider: gemini
  # gemini: use "gemini-1.5-flash" (free tier)
  # groq:   use "llama-3.3-70b-versatile" (free tier)
  model: gemini-2.0-flash
  # Ask user even for known merchants if confidence is below this threshold
  confidence_threshold: 0.85
