name: CI

# The tests, on every push and pull request. Deploy (deploy.yml) waits for
# this to pass on main before it touches the homelab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same Python as both Dockerfiles.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            finance-site/requirements.txt

      - run: pip install -r requirements.txt -r finance-site/requirements.txt

      # A syntax error anywhere fails here, before it reaches the bot.
      - name: Compile everything
        run: python -m compileall -q bot finance-site

      # Each test file is a plain script that exits non-zero on any failure.
      - name: Tests
        run: |
          for t in finance-site/test_*.py; do
            echo "== $t"
            python "$t"
          done
